---
- name: Installer les dépendances nécessaires
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes

- name: Ajouter la clé GPG officielle de Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Ajouter le dépôt Docker à APT sources
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Mettre à jour la liste des paquets APT
  apt:
    update_cache: yes

- name: Installer Docker et des outils complémentaires
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: S'assurer que le service Docker est démarré et activé au démarrage
  systemd:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur actuel au groupe docker (facultatif)
  user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: yes